<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="description" content="Registro de entrenos con plan, cargas sugeridas y rangos por músculo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-512.png">
<link rel="preload" href="fuentes/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:400 800;font-display:swap;src:url(fuentes/jakarta-latin.woff2) format("woff2")}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Atlas Gym</title>
<style>
/* Una app de móvil en negro: columna de 480 px como máximo, barra de pestañas abajo y el entreno a pantalla completa.
   Tema único oscuro, a propósito (como la app en la que se inspira). */
:root{
  color-scheme:dark;
  --bg:#000000; --s1:#111214; --s2:#1A1C20; --s3:#25282E; --line:#2B2E35;
  --fg:#F4F5F7; --muted:#8C919A; --dim:#5E636C;
  --acc:#3D8BFF; --acc2:#3AB2F6; --accdim:rgba(61,139,255,.36);
  --body:#2C2F36; --ok:#34C27B; --bad:#EF5A4C; --rosa:#F38DB7;
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--fg)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-inline:16px}
.pantalla{padding-block:16px 120px;display:flex;flex-direction:column;gap:22px}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;width:100%}
.btn-blanco{background:var(--fg);color:#000}
.btn-blanco:active{transform:scale(.985)}
.btn-gris{background:var(--s2);color:var(--fg);text-transform:none;letter-spacing:0;font-weight:600}
.btn-azul{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.enlace{color:var(--fg);font-weight:700;text-decoration:none;border-bottom:1px solid var(--dim)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--s2);font-weight:600;font-size:13.5px;white-space:nowrap}
.chip svg{width:15px;height:15px}
.etq{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:14px}
.tarjeta{background:var(--s1);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.fila{display:flex;align-items:center;gap:12px}
.entre{justify-content:space-between}
.crece{flex:1;min-width:0}

/* Onboarding */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-block:12px 24px;gap:20px}
.ob-cab{display:flex;align-items:center;gap:14px;height:44px}
.ob-atras{width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.barra-prog{flex:1;height:8px;border-radius:99px;background:var(--s3);overflow:hidden}
.barra-prog i{display:block;height:100%;background:var(--fg);border-radius:99px;transition:width .35s}
.ob h1{font-size:25px;font-weight:700;line-height:1.25}
.ob .centro{text-align:center}
.ob-pie{margin-top:auto;display:flex;flex-direction:column;gap:14px;position:sticky;bottom:0;padding:18px 0 calc(env(safe-area-inset-bottom,0px) + 4px);background:linear-gradient(to bottom,transparent,var(--bg) 26%)}
.logo{display:flex;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:34px;letter-spacing:-.02em}
.logo svg{width:40px;height:40px}
.laurel{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;text-align:center}
.laurel b{display:block;font-size:22px;font-weight:800}
.laurel span{font-size:13px;color:#C9CCD2}
.laurel svg{width:48px;height:76px}
.segmento{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px;margin:0 auto;width:min(270px,100%)}
.segmento button{flex:1;height:44px;border-radius:999px;font-weight:600;color:var(--muted)}
.segmento button.on{background:var(--fg);color:#000}
.segmento.ancho{width:100%}
.segmento.ancho button{height:40px;font-size:13.5px}
.codigo{font-size:34px;font-weight:800;letter-spacing:.18em;text-align:center;padding:2px 0}
.opciones{display:flex;flex-direction:column;gap:10px}
.opcion{display:flex;align-items:center;gap:14px;text-align:left;background:var(--s1);border:1.5px solid transparent;border-radius:16px;padding:16px}
.opcion.on{border-color:var(--fg);background:var(--s2)}
.opcion b{display:block;font-weight:700}
.opcion span{color:var(--muted);font-size:13.5px}
.marca{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none}
.on>.marca,.marca.on{background:var(--fg);border-color:var(--fg)}
.marca svg{width:14px;height:14px;opacity:0}
.on>.marca svg,.marca.on svg{opacity:1}
.datos-num{display:flex;flex-direction:column;gap:12px}
.campo{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s1);border-radius:16px;padding:10px 12px 10px 18px}
.campo label{font-weight:600}
.paso{display:flex;align-items:center;gap:8px}
.paso button{width:38px;height:38px;border-radius:10px;background:var(--s3);font-size:20px;font-weight:600}
.paso input{width:74px;height:40px;text-align:center;background:transparent;border:0;font-size:20px;font-weight:700}
.paso small{color:var(--muted);width:22px}
.pildoras{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pildora{min-width:58px;height:58px;border-radius:16px;background:var(--s1);border:1.5px solid transparent;font-size:20px;font-weight:700;padding:0 14px}
.pildora.on{border-color:var(--fg);background:var(--s2)}
.equipo-grupo{display:flex;flex-direction:column}
.equipo-cab{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 10px;font-size:18px;font-weight:700}
.equipo-item{display:flex;align-items:center;gap:14px;padding:10px 4px;border-radius:14px;text-align:left;width:100%}
.equipo-item .ico{width:56px;height:56px;border-radius:14px;background:var(--fg);color:#000;display:grid;place-items:center;flex:none;transition:opacity .2s}
.equipo-item .ico svg{width:30px;height:30px}
.equipo-item .nom{flex:1;font-weight:600}
.equipo-item:not(.on) .ico{opacity:.35}
.equipo-item:not(.on) .nom{color:var(--muted)}
.relato{flex:1;display:flex;flex-direction:column;gap:18px;text-align:center}
.relato-vis{height:300px;border-radius:24px;overflow:hidden;position:relative;background:radial-gradient(120% 80% at 50% 0%,#4A1018 0%,#160608 45%,#000 80%)}
.relato-vis svg{width:100%;height:100%}
.relato h1{font-size:23px}
.relato p{color:var(--muted);max-width:34ch;margin:0 auto}
.relato p b{color:var(--fg);font-weight:600}
.puntos{display:flex;gap:8px;justify-content:center}
.puntos i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.puntos i.on{background:var(--fg)}
.promesa{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 90px) 24px calc(env(safe-area-inset-bottom,0px) + 40px);background:var(--bg);z-index:5}
.promesa::before{content:"";position:absolute;inset:60px -30% 0;border-radius:50% 50% 0 0/80px 80px 0 0;background:linear-gradient(180deg,#3B6CF0 0%,#3A8DF2 55%,#3AA6F5 100%);z-index:-1}
.promesa p{font-size:22px;font-weight:500;line-height:1.45;max-width:20ch}
.promesa p b{font-weight:800}
.promesa .lema{margin-top:30px;font-size:19px}
.huella{margin-top:auto;position:relative;width:120px;height:120px;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.huella svg.h{width:74px;height:74px}
.huella svg.aro{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.huella-txt{margin-top:10px;font-size:14px;font-weight:600;opacity:.9}
.generando{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;text-align:center}
.generando .pct{font-size:56px;font-weight:800}
.generando h2{font-size:22px;font-weight:600}
.barra-azul{width:100%;height:6px;border-radius:99px;background:var(--s3);overflow:hidden}
.barra-azul i{display:block;height:100%;background:var(--acc);transition:width .4s}
.lineas{display:flex;flex-direction:column;gap:6px;color:var(--dim)}
.lineas .on{color:#D6D9DE}

/* Barra de pestañas */
.pestanas{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(10,10,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:10}
.pestanas button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim);padding:4px 0}
.pestanas button svg{width:24px;height:24px}
.pestanas button.on{color:var(--fg)}
.en-curso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:min(calc(100% - 32px),448px);display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font-weight:700;z-index:11}

/* Cabecera de las pestañas */
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.cab h1{font-size:28px;font-weight:800}
.marca-mini{display:flex;align-items:center;gap:6px;font-weight:800;font-size:20px}
.marca-mini svg{width:24px;height:24px}
.aviso-demo{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--s2);border:1px dashed var(--dim);border-radius:14px;padding:10px 14px;font-size:13.5px}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:12px;font-size:12px;color:var(--muted);font-weight:600}
.dia b{font-size:16px;color:var(--fg)}
.dia.hoy{background:var(--s2)}
.dia i{width:6px;height:6px;border-radius:50%;background:transparent}
.dia.hecho i{background:var(--acc)}
.hoy-card{background:var(--s1);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hoy-card h2{font-size:24px;font-weight:800}
.hoy-figs{display:flex;justify-content:center;gap:4px;height:190px}
.hoy-figs svg{height:100%;width:auto}
.metas{display:flex;flex-wrap:wrap;gap:8px}
.lista{display:flex;flex-direction:column}
.lista-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.lista-item:last-child{border-bottom:0}
.lista-item .t{font-weight:700}
.lista-item .d{color:var(--muted);font-size:13px}
.mini{width:46px;height:46px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none;overflow:hidden}
.mini svg{height:42px;width:auto}
.flecha{color:var(--dim)}

/* Entreno a pantalla completa */
.entreno{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.entreno-in{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 140px)}
.e-cab{display:flex;align-items:center;gap:10px;padding:6px 16px 10px;position:sticky;top:0;background:var(--bg);z-index:2}
.e-cab .crono{font-size:20px;font-weight:700;flex:1}
.ic-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px}
.ic-btn svg{width:22px;height:22px}
.ic-btn.escucha{background:var(--acc);color:#fff;animation:latido 1.2s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.08)}}
.voz-aviso{margin:0 16px 10px;padding:10px 12px;border-radius:12px;background:var(--s2);font-size:14px;color:var(--fg)}
.btn-fin{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--s1);font-weight:600}
.carrusel{display:flex;gap:14px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.carrusel::-webkit-scrollbar{display:none}
.circulo{flex:none;width:86px;height:86px;border-radius:50%;background:var(--s1);border:2px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
.circulo.on{border-color:var(--fg)}
.circulo svg.fig{height:78px;width:auto;margin-top:12px}
.circulo .ok{position:absolute;right:10px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--acc);display:grid;place-items:center}
.circulo .ok svg{width:12px;height:12px}
.circulo.mas{font-size:30px;color:var(--muted);border-style:dashed}
.e-fig{height:250px;display:flex;justify-content:center;align-items:center;position:relative}
.e-fig svg{height:240px;width:auto}
.e-fig .equipo-tag{position:absolute;left:16px;bottom:8px;display:flex;gap:6px}
.e-fig .equipo-tag span{width:34px;height:34px;border-radius:10px;background:var(--s2);display:grid;place-items:center}
.e-fig .equipo-tag svg{width:20px;height:20px}
.e-fig .lado{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--muted)}
.e-info{padding:0 16px;display:flex;flex-direction:column;gap:4px}
.e-info h2{font-size:18px;font-weight:700}
.e-info .sub b{color:var(--fg);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tabla{padding:8px 16px 0;display:flex;flex-direction:column;gap:10px}
.t-cab,.t-fila{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:10px;align-items:center}
.t-cab{font-size:13px;font-weight:700;letter-spacing:.06em;color:#C9CCD2;text-align:center;padding-bottom:4px}
.t-cab span:first-child{text-align:left;padding-left:6px}
.chispa{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--acc);display:grid;place-items:center;margin:0 auto;box-shadow:0 0 14px rgba(61,139,255,.45);color:var(--acc)}
.chispa svg{width:18px;height:18px}
.t-fila .n{width:36px;height:36px;border-radius:9px;background:var(--s2);display:grid;place-items:center;font-weight:700;color:#C9CCD2}
.t-fila input{width:100%;height:46px;border-radius:10px;border:0;background:var(--s2);text-align:center;font-size:17px;font-weight:600}
.t-fila input::placeholder{color:var(--dim)}
.t-fila.hecha input{background:rgba(61,139,255,.14)}
.check{width:36px;height:36px;border-radius:50%;background:var(--s3);display:grid;place-items:center;margin:0 auto}
.check svg{width:16px;height:16px}
.t-fila.hecha .check{background:var(--acc)}
.rec{margin:4px 16px 0;padding:12px 14px;border-radius:12px;background:rgba(61,139,255,.1);border:1px solid rgba(61,139,255,.3);font-size:13.5px;display:flex;gap:10px}
.rec svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--acc)}
.rec b{font-weight:700}
.add-set{margin:6px 16px 0;height:50px;border-radius:12px;background:var(--s1);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;width:calc(100% - 32px)}
.quitar-set{display:block;margin:10px auto 0;color:var(--muted);font-size:13px}
.dictar{display:flex;gap:8px;margin:14px 16px 0}
.dictar input{flex:1;min-width:0;height:46px;border-radius:12px;border:0;background:var(--s1);padding:0 14px;font-size:16px;color:var(--fg)}
.hoja .dictar input{background:var(--s2)}
.dictar button{flex:none;width:46px;height:46px;border-radius:12px;background:var(--s2);color:var(--fg);display:grid;place-items:center}
.barra-voz{height:8px;border-radius:4px;background:var(--s2);overflow:hidden;margin:8px 0 4px}.barra-voz i{display:block;height:100%;background:var(--acc)}
.e-nav{display:flex;gap:10px;padding:18px 16px 0}
.descanso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(calc(100% - 32px),448px);background:var(--s2);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:21;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.descanso .t{font-size:24px;font-weight:800;flex:1}
.descanso .t small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.descanso button{height:38px;padding:0 12px;border-radius:10px;background:var(--s3);font-weight:700;font-size:13px}
.descanso .barra-azul{position:absolute;left:14px;right:14px;bottom:6px;width:auto;height:3px}

/* Hoja inferior */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.hoja{width:min(100%,480px);max-height:88vh;overflow-y:auto;background:var(--s1);border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:16px}
.hoja::before{content:"";display:block;width:40px;height:5px;border-radius:99px;background:var(--s3);margin:0 auto 4px}
.hoja h3{font-size:20px;font-weight:800}
.hoja textarea{width:100%;min-height:110px;background:var(--s2);border:0;border-radius:12px;padding:12px;resize:vertical}
.hoja input[type=search],.hoja input[type=text]{width:100%;height:46px;background:var(--s2);border:0;border-radius:12px;padding:0 14px}
.filtros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filtros .chip.on{background:var(--fg);color:#000}
.resumen-fin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dato{background:var(--s2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.dato b{font-size:20px;font-weight:800}
.dato span{font-size:12px;color:var(--muted)}

/* Rangos */
.rango-top{display:flex;align-items:center;gap:16px}
.rango-top svg.emb{width:84px;height:96px;flex:none}
.rango-top h2{font-size:24px;font-weight:800}
.mapa{display:flex;justify-content:center;gap:10px;height:330px}
.mapa svg{height:100%;width:auto}
.mapa svg [data-m]{cursor:pointer}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--muted)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px}
.musculo-fila{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.musculo-fila:last-child{border-bottom:0}
.musculo-fila svg{width:30px;height:34px}
.musculo-fila .t{font-weight:700}
.prog{height:5px;border-radius:99px;background:var(--s3);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;border-radius:99px}
.pill{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--s2);white-space:nowrap}

/* Progreso */
.datos3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grafica svg{width:100%;height:auto;display:block}
.grafica text{fill:var(--muted);font-size:10px;font-family:var(--f)}
.sel{height:42px;border-radius:12px;background:var(--s2);border:0;padding:0 12px;width:100%}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fotos button{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--s2);position:relative;max-width:100%}
.fotos img{width:100%;height:100%;object-fit:cover}
.fotos small{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px}
.fotos .anadir{display:grid;place-items:center;color:var(--muted);font-size:13px;border:1.5px dashed var(--dim)}
.peso-in{display:flex;gap:8px}
.peso-in input{flex:1;min-width:0;height:46px;border-radius:12px;border:0;background:var(--s2);padding:0 14px;font-size:16px}
.peso-in button{width:auto;padding:0 18px}

/* Perfil */
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.form input,.form select{height:44px;border-radius:12px;border:0;background:var(--s2);padding:0 12px;font-size:15px;width:100%;min-width:0}
.chips-eq{display:flex;flex-wrap:wrap;gap:8px}
.chips-eq .chip{background:var(--s2);color:var(--muted)}
.chips-eq .chip.on{background:var(--fg);color:#000}
.plan-dia{display:flex;flex-direction:column;gap:2px}
.plan-dia h4{margin:0 0 4px;font-size:15px}
.plan-ej{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;text-align:left;width:100%}
.plan-ej span:last-child{color:var(--muted);white-space:nowrap}
.estado{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.estado i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.estado i.ok{background:var(--ok)}

/* Escáner y chat */
.subida{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subida label{aspect-ratio:3/4;border-radius:16px;border:1.5px dashed var(--dim);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;overflow:hidden;position:relative;cursor:pointer;max-width:100%}
.subida label img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.subida input{position:absolute;opacity:0;width:1px;height:1px}
.escaneo-res{display:flex;gap:14px;align-items:center}
.escaneo-res .figs{display:flex;gap:4px;height:180px;flex:none}
.escaneo-res .figs svg{height:100%;width:auto}
.burbujas{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto}
.burbuja{padding:10px 14px;border-radius:16px;max-width:85%;white-space:pre-wrap;font-size:14.5px}
.burbuja.yo{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.burbuja.el{align-self:flex-start;background:var(--s2);border-bottom-left-radius:4px}
.chat-in{display:flex;gap:8px}
.chat-in input{flex:1;min-width:0;height:46px;border-radius:12px;border:0;background:var(--s2);padding:0 14px}
.chat-in button{width:auto;padding:0 16px;height:46px}
.vacio{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--fg);color:#000;font-weight:700;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
input,select,textarea{font-size:16px!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const CORPORAL = t => t === 'c' || t === 'n';

const TIPOS = { b: 'Barra (kg totales)', m: 'Mancuernas (kg de cada una)', k: 'Una sola pesa', q: 'Máquina o polea', c: 'Peso corporal', n: 'Banda elástica' };

// Los ejercicios de cada uno: S.ejercicios guarda, por id, los propios (propio: true, completos) y los

const EJ = {};
function elDefecto(m, t) {
  const media = l => l.length ? l.reduce((a, b) => a + b[6], 0) / l.length : null;
  return media(BIB.filter(b => b[2] === m && b[5] === t)) ?? media(BIB.filter(b => b[5] === t)) ?? 1;
}
function rehacerEJ() {
  for (const k in EJ) delete EJ[k];

  const propios = S?.ejercicios && typeof S.ejercicios === 'object' ? S.ejercicios : {};
  for (const [id, c] of Object.entries(propios)) {
    const base = EJ[id];
    if (!c || typeof c !== 'object' || (!base && !c.propio)) continue;
    const e = { ...(base || {}), ...c, id };
    e.n = String(e.n || '').trim().slice(0, 60) || base?.n || 'Ejercicio';
    if (!MUSC[e.m]) e.m = base?.m || 'pecho';
    if (!TIPOS[e.t]) e.t = base?.t || 'q';
    e.s = (Array.isArray(e.s) ? e.s : []).filter(x => MUSC[x] && x !== e.m);
    e.eq = (Array.isArray(e.eq) ? e.eq : []).filter(x => NOMBRE_EQ[x]);
    e.tip = String(e.tip || '').slice(0, 300);
    e.el = base && e.t === base.t ? base.el : elDefecto(e.m, e.t); // el nivel de élite no se edita: sale del tipo y del músculo

  }

  // que no cuenta para los rangos, para que nada se rompa.
  const deEntrenos = [...(S?.entrenos || []), ...(S?.activo ? [S.activo] : [])];
  for (const e of deEntrenos) for (const x of e.ejercicios || []) {
    if (!x?.id || EJ[x.id]) continue;
    const d = x.def && MUSC[x.def.m] && TIPOS[x.def.t] ? x.def : null;
    EJ[x.id] = d ? { id: x.id, n: String(d.n || 'Ejercicio').slice(0, 60), m: d.m, s: (d.s || []).filter(y => MUSC[y]), eq: (d.eq || []).filter(y => NOMBRE_EQ[y]), t: d.t, el: elDefecto(d.m, d.t), tip: '', propio: true, oculto: true }

  if (S?.plan?.dias) for (const d of S.plan.dias) d.ejercicios = (d.ejercicios || []).filter(x => EJ[x.id] && !EJ[x.id].fantasma);

function ultimaVez(id, antesDe) {
  for (let i = S.entrenos.length - 1; i >= 0; i--) {
    const e = S.entrenos[i];
    if (antesDe && e.id === antesDe) continue;
    const x = e.ejercicios.find(y => y.id === id);
    if (x && x.series.some(s => s.hecho)) return { fecha: e.fecha, series: x.series.filter(s => s.hecho) };
  }
  return null;
}
function sugerir(id, obj, n = 3) {
  const ex = EJ[id], rmin = obj?.repMin || 8, rmax = obj?.repMax || 12;
  const u = ultimaVez(id);
  const completas = u && u.series.length >= n;
  if (CORPORAL(ex.t)) {
    if (!u) return { kg: null, reps: rmin, motivo: 'Primera vez: haz las que puedas con buena técnica y apúntalas.' };
    const mx = Math.max(...u.series.map(s => s.reps || 0));
    if (completas && u.series.every(s => s.reps >= rmax)) return { kg: null, reps: mx + 1, motivo: `Hiciste las ${u.series.length} series llegando a ${rmax}: añade una repetición más o métele un poco de lastre.` };
    if (!completas) return { kg: null, reps: Math.min(rmax, mx), motivo: `La última vez hiciste ${u.series.length} de ${n} series: complétalas antes de buscar más repeticiones.` };

  }
  const inc = incDe(ex.t), ud = UD(), K = v => +deUd(v, ud).toFixed(4);
  if (!u) {
    const bw = pesoCorporal(), mult = multSexo(ex.m, S.perfil?.sexo), f = { principiante: 0.33, intermedio: 0.5, avanzado: 0.66 }[S.perfil?.nivel] || 0.45;

// Reloj: actualiza el cronómetro y el descanso sin repintar
setInterval(() => {
  if (!S.activo) return;
  document.querySelectorAll('[data-crono]').forEach(el => el.textContent = fmtDur((Date.now() - S.activo.inicio) / 1000));
  const a = S.activo;
  if (a.descansoFin) {
    const r = (a.descansoFin - Date.now()) / 1000;
    if (r <= 0) { a.descansoFin = null; guardar(); try { navigator.vibrate?.([200, 100, 200]); } catch (e) { } if (entrenoAbierto) { $('#descanso')?.remove(); toast('Descanso terminado: a por la siguiente serie'); } return; }
    const t = $('[data-rest]'); if (t) t.textContent = fmtDur(r);
    const b = $('[data-rest-barra]'); if (b) b.style.width = (100 * r / (a.descansoTotal || 1)) + '%';
  }
}, 500);

function finalizar(descartar) {
  const a = S.activo;
  const antes = rangosMusculo();
  const def = id => { const e = EJ[id]; return e?.propio && !e.fantasma ? { def: { n: e.n, m: e.m, s: e.s, eq: e.eq, t: e.t } } : {}; };
  const ejercicios = a.ejercicios.map(x => ({ id: x.id, ...def(x.id), nota: x.nota, series: x.series.filter(s => s.hecho && num(s.reps) > 0).map(s => ({ kg: +deUd(num(s.kg) || 0, a.ud || 'kg').toFixed(4), reps: Math.round(num(s.reps) || 0), hecho: true })) })).filter(x => x.series.length);

  hoja(`<div class="fila">${emblema(r?.t ?? null, 'width="56" height="64"')}<div><h3>${MUSC[m]}</h3><span class="pill" style="color:${r ? colorRango(r.t) : 'var(--muted)'}">${nombreRango(r?.t)}</span></div></div>

async function analizar() {
  const est = $('#esc-estado'), btn = $('[data-a="analizar"]');
  const fotos = [fotosEscaner.frente?.file, fotosEscaner.espalda?.file].filter(Boolean);
  btn.disabled = true; est.textContent = 'Claude está mirando las fotos… (puede tardar un minuto)';
  const p = S.perfil;
  try {
    const r = await IA.json(`Eres entrenador personal. Te paso ${fotos.length === 2 ? 'dos fotos (de frente y de espalda)' : 'una foto'} del físico de una persona (${p.sexo}, ${p.edad} años, ${pesoCorporal()} kg, ${p.altura} cm) que quiere saber qué grupos musculares tiene más y menos desarrollados respecto a su propio cuerpo, para equilibrar su entrenamiento.
Puntúa de 0 a 100 el desarrollo visible de cada grupo (100 = su grupo más desarrollado). Si un grupo no se ve en las fotos, pon null.
Claves: ${Object.keys(MUSC).join(', ')}.
Responde solo con JSON: {"puntuaciones":{"pecho":70,...},"grasa":"14–17 %","fuertes":["hombros","pecho"],"debiles":["gemelos","femorales"],"resumen":"dos o tres frases en español, en tono de entrenador","consejos":["consejo práctico 1","consejo práctico 2","consejo práctico 3"]}
Usa solo esas claves en fuertes y debiles (de 1 a 3 cada una). Si la foto no muestra un cuerpo, responde {"error":"motivo en español"}.`, { images: fotos });
    if (r?.error) { est.textContent = r.error; btn.disabled = false; return; }
    const pun = {}; for (const m in MUSC) { const v = r?.puntuaciones?.[m]; pun[m] = v == null || !isFinite(+v) ? null : clamp(+v, 0, 100); }
    const valida = l => (Array.isArray(l) ? l : []).filter(m => MUSC[m]).slice(0, 3);
    S.escaneo = { fecha: hoyISO(), puntuaciones: pun, grasa: String(r.grasa || '').slice(0, 30), fuertes: valida(r.fuertes), debiles: valida(r.debiles), resumen: String(r.resumen || '').slice(0, 500), consejos: (Array.isArray(r.consejos) ? r.consejos : []).slice(0, 4).map(c => String(c).slice(0, 200)) };
    fotosEscaner = { frente: null, espalda: null };
    guardar(); hojaEscaner(); pintar();
  } catch (e) {
    btn.disabled = false;
    est.textContent = { not_granted: 'No has dado permiso a la app para usar Claude.', rate_limited: 'Has llegado al límite de uso. Prueba más tarde.', image_rejected: 'Esa foto no vale: prueba con otra (JPG o PNG).', refused: 'Claude no ha querido analizar esta foto. Prueba con otra.', invalid_json: 'La respuesta salió mal. Dale otra vez.' }[e?.code] || 'No ha salido. Prueba otra vez.';
  }
}
function reforzar() {
  const deb = new Set(S.escaneo?.debiles || []); let n = 0;
  for (const d of S.plan.dias) for (const x of d.ejercicios) if (deb.has(EJ[x.id].m) && x.series < 5) { x.series++; n++; }
  guardar(); cerrarHoja(); pintar();
  toast(n ? `Plan ajustado: +1 serie en ${n} ejercicio${n > 1 ? 's' : ''}` : 'Tu plan no tiene ejercicios de esos músculos: añádelos en Perfil');
}

// ---------- Progreso ----------
let ejGrafica = null;
function vistaProgreso(ver = false) {
  const ents = S.entrenos;
  const total = ents.reduce((a, e) => a + volumen(e), 0), series = ents.reduce((a, e) => a + e.ejercicios.reduce((b, x) => b + x.series.length, 0), 0);
  const lun = lunesDe(hoyISO()), semanas = Array.from({ length: 8 }, (_, i) => sumarDias(lun, -7 * (7 - i)));
  const vol = semanas.map(s => ents.filter(e => lunesDe(e.fecha) === s).reduce((a, e) => a + volumen(e), 0));
  const conHist = [...new Set(ents.flatMap(e => e.ejercicios.map(x => x.id)))].filter(id => EJ[id] && !CORPORAL(EJ[id].t));
  if (!ejGrafica || !conHist.includes(ejGrafica)) ejGrafica = conHist[0] || null;
  const serie = ejGrafica ? ents.map(e => { const x = e.ejercicios.find(y => y.id === ejGrafica); if (!x) return null; return { f: e.fecha, v: Math.max(...x.series.map(s => e1rm(s.kg || 0, s.reps || 0))) }; }).filter(Boolean) : [];
  const pesos = S.pesos || [];
  return `${ver ? '' : '<div class="pantalla"><div class="cab"><h1>Progreso</h1></div>'}
    <div class="datos3"><div class="dato"><b class="num">${ents.length}</b><span>entrenos</span></div><div class="dato"><b class="num">${series}</b><span>series</span></div><div class="dato"><b class="num">${total >= 10000 && UD() === 'kg' ? fmt(total / 1000) + ' t' : fVolumen(total)}</b><span>${total >= 10000 && UD() === 'kg' ? 'movidas' : UD() + ' movidos'}</span></div></div>
    <section class="tarjeta"><div class="fila entre"><b>Volumen por semana</b><span class="sub">${UD()} × reps</span></div><div class="grafica">${graficaBarras(vol.map(v => aUd(v)), semanas.map(s => fechaCorta(s)))}</div></section>
    <section class="tarjeta"><b>Fuerza estimada (1RM)</b>
      ${conHist.length ? `<select class="sel" id="sel-ej" data-sel="ej">${conHist.map(id => `<option value="${id}" ${id === ejGrafica ? 'selected' : ''}>${esc(EJ[id].n)}</option>`).join('')}</select><div class="grafica">${graficaLinea(serie.map(s => aUd(s.v)), serie.map(s => fechaCorta(s.f)), UD())}</div>` : '<p class="vacio">Cuando apuntes series con peso verás aquí cómo sube tu fuerza.</p>'}
    </section>
    <section class="tarjeta"><b>Peso corporal</b>
      ${pesos.length > 1 ? `<div class="grafica">${graficaLinea(pesos.map(p => aUd(p.kg, UDP())), pesos.map(p => fechaCorta(p.fecha)), UDP())}</div>` : ''}
      ${ver ? (pesos.length ? '' : '<p class="sub">Aún no ha apuntado su peso.</p>') : `<div class="peso-in"><input id="peso-nuevo" class="num" inputmode="decimal" placeholder="Peso de hoy (${UDP()})" aria-label="Peso de hoy en ${UDP() === 'lb' ? 'libras' : 'kilos'}"><button class="btn btn-blanco" data-a="peso">Apuntar</button></div>`}
      ${pesos.length ? `<p class="sub">Último: <b class="num">${fPeso(pesos[pesos.length - 1].kg)}</b> · ${fechaCorta(pesos[pesos.length - 1].fecha)}</p>` : ''}
    </section>
    ${ver ? '' : `<section class="tarjeta"><div class="fila entre"><b>Fotos de progreso</b><span class="sub">${S.fotos.length}</span></div>
      <div class="fotos"><label class="anadir" for="foto-prog" style="aspect-ratio:3/4;border-radius:12px;display:grid;place-items:center;cursor:pointer;text-align:center;color:var(--muted);font-size:13px;border:1.5px dashed var(--dim)"><span>${I.camara}<br>Añadir</span><input type="file" id="foto-prog" accept="image/*" data-foto-prog style="position:absolute;opacity:0;width:1px;height:1px"></label>${[...S.fotos].reverse().map(f => `<button data-a="ver-foto" data-id="${f.id}"><img src="${f.src}" alt="Foto del ${fechaCorta(f.fecha)}"><small>${fechaCorta(f.fecha)}</small></button>`).join('')}</div>
    </section>`}
    <section><div class="etq" style="margin-bottom:4px">Historial</div>
      ${ents.length ? `<div class="lista">${[...ents].reverse().map(e => `<button class="lista-item" data-a="ver-entreno" data-id="${e.id}"><span class="crece"><span class="t">${esc(e.nombre)}</span><br><span class="d num">${fechaCorta(e.fecha)} · ${fmtDur(e.duracion)} · ${e.ejercicios.length} ejercicios · ${fVolumen(volumen(e))} ${UD()}</span></span><span class="flecha">${I.derecha}</span></button>`).join('')}</div>` : `<p class="vacio">${ver ? 'Aún no ha hecho ningún entreno.' : 'Aún no hay entrenos. El primero aparecerá aquí al terminarlo.'}</p>`}
    </section>
  ${ver ? '' : '</div>'}`;
}
function graficaBarras(v, et) {
  const W = 320, H = 150, pb = 22, max = Math.max(1, ...v), bw = W / v.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Volumen semanal">`;
  for (let k = 1; k <= 3; k++) s += `<line x1="0" x2="${W}" y1="${(H - pb) * (1 - k / 3)}" y2="${(H - pb) * (1 - k / 3)}" stroke="var(--line)" stroke-dasharray="2 4"/>`;
  v.forEach((x, i) => {
    const h = (H - pb - 14) * x / max, ult = i === v.length - 1;
    s += `<rect x="${i * bw + 6}" y="${H - pb - h}" width="${bw - 12}" height="${Math.max(h, x ? 2 : 0)}" rx="5" fill="${ult ? 'var(--acc)' : 'var(--s3)'}"/>`;
    if (i % 2 === 1 || ult) s += `<text x="${i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${et[i]}</text>`;
    if (ult && x) s += `<text x="${i * bw + bw / 2}" y="${H - pb - h - 4}" text-anchor="middle" style="fill:var(--fg);font-weight:700">${fmtMiles(x)}</text>`;
  });
  return s + '</svg>';
}
function graficaLinea(v, et, ud) {
  if (!v.length) return '';
  const W = 320, H = 150, pl = 30, pb = 22, pt = 16, mn = Math.min(...v), mx = Math.max(...v), rg = mx - mn || 1;
  const lo = mn - rg * 0.15, hi = mx + rg * 0.15;
  const X = i => pl + (v.length === 1 ? (W - pl) / 2 : i * (W - pl - 10) / (v.length - 1)), Y = y => pt + (H - pt - pb) * (1 - (y - lo) / (hi - lo));
  const pts = v.map((y, i) => `${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join(' ');
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución en ${ud}">`;
  [lo + (hi - lo) * 0.2, (lo + hi) / 2, lo + (hi - lo) * 0.8].forEach(y => s += `<line x1="${pl}" x2="${W}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${pl - 4}" y="${Y(y) + 3}" text-anchor="end">${fmt(y, 0)}</text>`);
  s += `<polygon points="${X(0)},${H - pb} ${pts} ${X(v.length - 1)},${H - pb}" fill="var(--acc)" opacity=".12"/>`;
  s += `<polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  const n = v.length - 1;
  s += `<circle cx="${X(n)}" cy="${Y(v[n])}" r="4.5" fill="var(--acc)" stroke="var(--bg)" stroke-width="2"/><text x="${Math.min(X(n), W - 30)}" y="${Y(v[n]) - 9}" text-anchor="middle" style="fill:var(--fg);font-weight:700">${fmt(v[n])} ${ud}</text>`;
  s += `<text x="${X(0)}" y="${H - 6}" text-anchor="start">${et[0]}</text>${n ? `<text x="${X(n)}" y="${H - 6}" text-anchor="end">${et[n]}</text>` : ''}`;
  return s + '</svg>';
}

function guardarEjercicio() {
  const b = borradorEj; b.n = b.n.trim();
  if (!b.n) { toast('Ponle un nombre'); $('#ej-n')?.focus(); return; }
  if (visibles().some(e => e.id !== b.id && sinTildes(e.n) === sinTildes(b.n))) { toast('Ya hay un ejercicio con ese nombre'); return; }
  S.ejercicios ||= {};
  const datos = { n: b.n, m: b.m, s: b.s.filter(x => x !== b.m), eq: b.eq, t: b.t, tip: b.tip.trim() };
  let id = b.id;
  if (!id) { id = 'p_' + nuevoId(); S.ejercicios[id] = { propio: true, ...datos }; }
  else if (S.ejercicios[id]?.propio) S.ejercicios[id] = { ...S.ejercicios[id], ...datos };
  else {
    // De la biblioteca: se guarda solo lo que cambia
    const [, n, m, s, eq, t, , tip] = BIB.find(x => x[0] === id), orig = { n, m, s, eq, t, tip }, cambio = {};
    for (const k in datos) if (JSON.stringify(datos[k]) !== JSON.stringify(orig[k])) cambio[k] = datos[k];
    const oculto = S.ejercicios[id]?.oculto;
    if (Object.keys(cambio).length || oculto) S.ejercicios[id] = { ...cambio, ...(oculto ? { oculto } : {}) }; else delete S.ejercicios[id];

  rehacerEJ(); guardar();
  const volver = b.volver; borradorEj = null;
  if (!b.id && volver && volver.modo !== 'biblioteca') { elegirEj(volver, id); toast('Ejercicio creado y añadido'); return; }
  toast(b.id ? 'Ejercicio guardado' : 'Ejercicio creado');

  pintar();
}
// Dónde se usa un ejercicio: días de la rutina y entreno en curso (el historial no cuenta: allí se queda)
function usosEjercicio(id) {
  const dias = (S.plan?.dias || []).map((d, i) => d.ejercicios.some(x => x.id === id) ? `día ${i + 1} (${d.nombre})` : null).filter(Boolean);
  if (S.activo?.ejercicios.some(x => x.id === id)) dias.push('el entreno en curso');

  if (e.propio && !enHistorial) delete S.ejercicios[id]; // nunca se usó: fuera del todo

function elegirEj(c, id) {

      S.activo.ejercicios.splice(S.activo.idx + 1, 0, { id, obj: { ...x.obj }, descanso: x.descanso, nota: '', series: Array.from({ length: faltan }, vacia) });
      S.activo.idx++;
    } else { x.id = id; x.series = x.series.map(vacia); }

  if (c.modo === 'plan-add') S.plan.dias[c.d].ejercicios.push({ id, series: 3, repMin: 8, repMax: 12, descanso: 90 });

}

async function enviarChat(texto) {
  if (enviando) return; enviando = true;
  chat.push({ role: 'user', content: texto }); hojaChat();
  const btn = $('#chat-form button'); if (btn) btn.disabled = true;
  const b = $('#burbujas'), burb = document.createElement('div'); burb.className = 'burbuja el'; burb.textContent = 'Pensando…'; b.append(burb); b.scrollTop = b.scrollHeight;

function toast(t) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.append(el); } el.textContent = t; clearTimeout(tToast); tToast = setTimeout(() => el.remove(), 2600); }

// ---------- Fotos ----------
function comprimir(file, lado = 720) {
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, lado / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('imagen')); };
    img.src = url;
  });
}

// ---------- Datos de ejemplo ----------
function cargarDemo() {
  const p = { sexo: 'hombre', edad: 27, peso: 74, altura: 178, objetivo: 'musculo', nivel: 'intermedio', dias: 4, duracion: 60, equipo: [...TODO_EQUIPO] };
  S = estadoLimpio(); S.demo = true; S.perfil = { ...p, creado: sumarDias(hoyISO(), -42) };
  S.plan = planLocal(p); S.plan.nota = 'Plan de ejemplo.';
  let semilla = 7; const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
  const fuerza = { pecho: 0.62, dorsales: 0.58, hombros: 0.5, biceps: 0.55, triceps: 0.52, cuadriceps: 0.6, femorales: 0.42, gluteos: 0.48, gemelos: 0.3, abdomen: 0.5, trapecio: 0.55, lumbares: 0.5, antebrazos: 0.4 };
  const inicio = sumarDias(lunesDe(hoyISO()), -35), offs = [0, 1, 3, 4];
  let k = 0;
  for (let w = 0; w < 6; w++) for (let j = 0; j < 4; j++) {
    const fecha = sumarDias(inicio, w * 7 + offs[j]); if (fecha > hoyISO()) continue;
    const di = k % 4, d = S.plan.dias[di], prog = 1 + w * 0.025;
    const e = { id: 'demo' + k, fecha, bw: p.peso, inicio: new Date(fecha + 'T18:30:00').getTime(), duracion: 3300 + Math.round(azar() * 900), diaIdx: di, nombre: d.nombre, ejercicios: [] };
    for (const x of d.ejercicios) {
      const ex = EJ[x.id], f = fuerza[ex.m] * prog * 0.8;
      const series = Array.from({ length: x.series }, (_, i) => {
        if (CORPORAL(ex.t)) return { kg: 0, reps: Math.max(4, Math.round(ex.el * f * 0.55 - i * 1.5 + azar() * 2)), hecho: true };
        const inc = INC[ex.t] || 2.5, kg = Math.round(ex.el * p.peso * f / (1 + 10 / 30) / inc) * inc;
        return { kg, reps: clamp(Math.round(x.repMax - i - azar() * 2), x.repMin - 1, x.repMax), hecho: true };
      });
      e.ejercicios.push({ id: x.id, nota: '', series });
    }
    S.entrenos.push(e); k++;
  }
  S.pesos = Array.from({ length: 7 }, (_, i) => ({ fecha: sumarDias(inicio, i * 7), kg: +(74 + i * 0.2 + (azar() - 0.5) * 0.4).toFixed(1) })).filter(x => x.fecha <= hoyISO());
  S.ob = { paso: 99 }; vista = 'inicio';
  guardarLocal(); pintar();
}

    // ---- Versión web: cuenta, rol y profesor ----
    case 'entrar': {
      const est = t.parentElement?.querySelector('[data-estado]');
      if (!api) { toast(navigator.onLine ? 'Un momento, aún está cargando. Prueba otra vez en unos segundos.' : 'Necesitas conexión para entrar.'); return; }
      t.disabled = true; if (est) est.textContent = 'Abriendo Google…';
      marcarEntrando(true); // por si Google abre en esta misma página y vuelve
      try { await api.entrar(); if (est) est.textContent = ''; }
      catch (er) {
        t.disabled = false; marcarEntrando(false);
        const m = ['auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'auth/user-cancelled'].includes(er?.code) ? '' : er?.code === 'auth/network-request-failed' ? 'Sin conexión. Prueba cuando tengas red.' : 'No se ha podido entrar. Prueba otra vez.';
        if (est) est.textContent = m; else if (m) toast(m);
      }
      return;
    }
    case 'sin-cuenta': S.sinCuenta = true; S.rol = 'alumna'; break;
    case 'rol': S.rolPedido = d.v; break;
    case 'rol-si': {
      const r = S.rolPedido; if (!r || !api?.usuario) return;
      S.rol = r; S.cuenta = { nombre: api.usuario.nombre, email: api.usuario.email };
      api.guardarCuenta({ rol: r, nombre: api.usuario.nombre, email: api.usuario.email, creada: hoyISO() });
      guardarLocal(); pintar(); arrancarRol(genWeb); return;
    }
    case 'salir': {
      if (!api?.usuario) return;
      t.disabled = true;
      if (tGuardar) { clearTimeout(tGuardar); subirPerfil(); }
      saliendo = true;
      try { await colaNube; const limpio = await api.salir(); if (!limpio) try { localStorage.setItem(LS + '-limpiar', '1'); } catch (e) { } }
      catch (er) {
        t.disabled = false; saliendo = false;
        if (er?.code === 'pendiente') { t.parentElement.innerHTML = `<p class="sub">Hay cosas que aún no han subido porque no hay conexión. Si cierras la sesión ahora, se pierden.</p><div class="fila" style="margin-top:8px"><button class="btn btn-gris" data-a="nada">Esperar</button><button class="btn btn-blanco" data-a="salir-si" style="background:var(--bad);color:#fff">Salir igualmente</button></div>`; return; }
        toast('No se ha podido cerrar la sesión. Prueba otra vez.'); return;
      }
      despuesDeSalir(); return;
    }
    case 'salir-si': saliendo = true; try { if (!await api.salir({ forzar: true })) localStorage.setItem(LS + '-limpiar', '1'); } catch (er) { console.warn(er); } despuesDeSalir(); return;
    case 'recargar': location.reload(); return;
    case 'nada': break;
    case 'vincular': {
      const c = d.c || $('#codigo-prof')?.value || '', est = t.closest('.hoja, .tarjeta')?.querySelector('[data-estado]');
      const decir = m => { if (est) est.textContent = m; else toast(m); };
      if (!navigator.onLine) { decir('Necesitas conexión para conectarte con tu profesor.'); return; }
      t.disabled = true; decir('Comprobando el código…');
      try {
        const p = await api.vincular(c);
        S.profesor = { id: p.id, nombre: p.nombre }; S.codigoPend = null; S.rutinaPend = null; guardarLocal(); cerrarHoja(); ultResumen = ''; tocarResumen();
        toast(p.pendiente ? `Se ha cortado la red: te conectas con ${p.nombre} en cuanto vuelva` : `Conectada con ${p.nombre}`);
        if (ultimaRutina) recibirRutina(ultimaRutina);
      } catch (er) {
        t.disabled = false;
        decir({ 'codigo-mal': 'El código son 6 letras o números. Revísalo.', 'no-existe': 'Ese código no existe. Pídeselo otra vez a tu profesor.', propio: 'Ese código es el tuyo.', 'sin-red': 'Sin conexión. Prueba cuando tengas red.' }[er?.code] || 'No ha salido. Prueba otra vez.');
        return;
      }
      break;
    }
    case 'vincular-no': S.codigoPend = null; guardarLocal(); cerrarHoja(); break;
    case 'desvincular': $('#desc-zona').innerHTML = `<p class="sub">Deja de ver tus datos y de poder mandarte la rutina. La rutina que tienes se queda.</p><div class="fila" style="margin-top:8px"><button class="btn btn-gris" data-a="nada">No</button><button class="btn btn-blanco" data-a="desvincular-si" style="background:var(--bad);color:#fff">Desconectarme</button></div>`; return;
    case 'desvincular-si': {
      t.disabled = true;
      let hecho;
      try { hecho = await api.desvincular(); } catch (er) { t.disabled = false; toast('No se ha podido desconectar. Prueba otra vez.'); return; }
      api.borrarRutinaRecibida(); S.profesor = null; S.rutinaPend = null; guardarLocal();
      if (hecho) toast('Desconectada: tu profesor ya no ve tus datos');
      else { pintar(); hoja(`<h3>Desconexión pendiente</h3><p class="sub">No hay conexión. Te desconectas en cuanto vuelva la red; hasta entonces, tu profesor aún puede ver tus datos.</p><button class="btn btn-gris" data-a="cerrar">Entendido</button>`); return; }
      break;
    }
    case 'codigo-nuevo': crearCodigoProf(); return;
    case 'copiar': {
      try { await navigator.clipboard.writeText(d.t); toast('Copiada: pégala donde quieras'); }
      catch (er) { hoja(`<h3>Tu invitación</h3><p class="sub">Cópiala y mándasela a tus alumnas.</p><textarea readonly>${esc(d.t)}</textarea><button class="btn btn-gris" data-a="cerrar">Cerrar</button>`); }
      return;
    }
    case 'ver-alumna': abrirAlumna(d.id); return;
    case 'ptab': S.ajena.tab = d.v; window.scrollTo(0, 0); break;
    case 'prof-volver':
      if (S.ajena.sucio) { hoja(`<h3>No le has enviado los cambios</h3><p class="sub">Has cambiado la rutina de ${esc(nombreCorto(S.ajena.nombre))} y aún no se la has enviado.</p><button class="btn btn-blanco" data-a="prof-enviar" data-salir="1">Enviar y volver</button><button class="btn btn-gris" data-a="prof-salir-sin" style="color:var(--bad)">Volver sin enviar</button><button class="btn btn-gris" data-a="cerrar">Seguir aquí</button>`); return; }
      salirDeAlumna(); return;
    case 'prof-salir-sin': salirDeAlumna(); return;
    case 'prof-enviar': enviarRutina(); if (d.salir) { salirDeAlumna(); return; } cerrarHoja(); break;
    case 'prof-soltar': $('#soltar-zona').innerHTML = `<p class="sub">Desaparece de tu lista y dejas de ver sus datos. Para volver, tendría que conectarse otra vez con tu código.</p><div class="fila" style="margin-top:8px"><button class="btn btn-gris" data-a="nada">No</button><button class="btn btn-blanco" data-a="prof-soltar-si" style="background:var(--bad);color:#fff">Dejar de seguirla</button></div>`; return;
    case 'prof-soltar-si': { const A = S.ajena; api.soltarAlumna(A.uid); salirDeAlumna(); toast(`Ya no sigues a ${nombreCorto(A.nombre)}`); return; }
    default: return;
  }
  if (S.ob?.paso < 99) guardarLocal();
  pintar();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in && S.activo) { const s = ejActual().series[+t.dataset.s]; s[t.dataset.in] = t.value; guardar(); return; }
  if (t.dataset.ob) { const v = t.dataset.ob === 'peso' ? deUd(num(t.value), UDP()) : num(t.value), [lo, hi] = LIM[t.dataset.ob]; if (v != null && v >= lo && v <= hi) borradorPerfil()[t.dataset.ob] = v; return; }
  if (t.dataset.ej && borradorEj) {
    const k = t.dataset.ej; borradorEj[k] = t.value;
    if (k === 'm') borradorEj.s = borradorEj.s.filter(x => x !== t.value);
    if (t.tagName === 'SELECT') hojaEjercicio(borradorEj.id, borradorEj.volver);
    return;
  }
  if (t.dataset.busca != null) { busq = t.value; const pos = t.selectionStart; hojaSelector(t.dataset.busca, hojaSelector.ctx); const n = $('#busca-ej'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.pf) {
    const k = t.dataset.pf, v = t.value;
    if (k === 'peso') { const kg = deUd(num(v), UDP()); if (kg && kg >= 30 && kg <= 250) { const hoy = hoyISO(); S.pesos = (S.pesos || []).filter(x => x.fecha !== hoy); S.pesos.push({ fecha: hoy, kg }); S.perfil.peso = kg; } }
    else if (LIM[k]) { const n = num(v); if (n != null && n >= LIM[k][0] && n <= LIM[k][1]) S.perfil[k] = n; else { t.value = S.perfil[k]; toast('Ese valor no vale'); return; } }
    else S.perfil[k] = ['dias', 'duracion'].includes(k) ? +v || S.perfil[k] : v;
    guardar(); return;
  }
  if (t.dataset.sel === 'ej') { ejGrafica = t.value; pintar(); return; }
  if (t.dataset.ud) { const E = S.ajena && PROF ? PROF : S; E.unidades = { ...unidades(), [t.dataset.ud]: t.value === 'lb' ? 'lb' : 'kg' }; if (S.ajena) guardarLocal(); else guardar(); pintar(); return; }
  if (t.dataset.fotoEsc) {
    const f = t.files?.[0]; if (!f) return;
    fotosEscaner[t.dataset.fotoEsc] = { file: f, url: await comprimir(f, 600) };
    hojaEscaner(); return;
  }
  if (t.dataset.fotoProg != null) {
    const f = t.files?.[0]; if (!f) return;
    try { const src = await comprimir(f, 720); const foto = { id: nuevoId(), fecha: hoyISO(), src }; S.fotos.push(foto); guardarFoto(foto); pintar(); toast('Foto guardada'); }
    catch (er) { toast('No se pudo leer esa foto'); }
  }
});
document.addEventListener('submit', e => {
  if (['dictar', 'dictar-hoja'].includes(e.target.id)) {
    e.preventDefault();
    const inp = e.target.querySelector('input'), v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    if (!S.activo) { toast('Empieza un entreno para apuntar las series'); return; }
    if (aplicarVoz([v])) { inp.value = ''; if (e.target.id === 'dictar-hoja') cerrarHoja(); }
    return;
  }
  if (e.target.id !== 'chat-form') return;
  e.preventDefault();
  const v = $('#chat-texto').value.trim(); if (v && IA) enviarChat(v);
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.activo) pintar(); });

pintar();
conectar();
</script>

<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));</script>
